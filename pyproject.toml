[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodusdeep"
version = "0.1.0"
description = "Distributed MoE inference over contributed hardware"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [{ name = "NodusDeep Contributors" }]
keywords = ["moe", "distributed-inference", "llm", "gguf", "p2p"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["nodusdeep[test]", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/0xCXY/NodusDeep"
Issues = "https://github.com/0xCXY/NodusDeep/issues"

[tool.setuptools.packages.find]
include = ["nodusdeep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
